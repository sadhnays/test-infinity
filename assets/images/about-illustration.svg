<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <rect width="600" height="500" fill="#0a0e27"/>
  <circle cx="300" cy="250" r="150" fill="url(#grad1)" opacity="0.1"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ccff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Team illustration -->
  <rect x="200" y="200" width="200" height="150" rx="20" fill="#1a1f3a" stroke="#0066ff" stroke-width="2"/>
  <circle cx="300" cy="150" r="50" fill="url(#grad1)"/>
  <text x="300" y="160" font-family="Arial,sans-serif" font-size="24" fill="white" text-anchor="middle">IS</text>
  <text x="300" y="300" font-family="Arial,sans-serif" font-size="18" fill="#00ccff" text-anchor="middle">Infinity SoftHub</text>
  <text x="300" y="330" font-family="Arial,sans-serif" font-size="14" fill="#8b8fa3" text-anchor="middle">Team of Experts</text>
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="30" fill="#0066ff" opacity="0.2"/>
  <circle cx="500" cy="400" r="40" fill="#00ccff" opacity="0.2"/>
  <circle cx="150" cy="400" r="25" fill="#00ffcc" opacity="0.2"/>
</svg>
