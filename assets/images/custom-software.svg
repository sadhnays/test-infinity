<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <rect width="600" height="500" fill="#0a0e27"/>
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffcc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Code/Software illustration -->
  <rect x="100" y="100" width="400" height="300" rx="20" fill="#1a1f3a" stroke="#00ccff" stroke-width="2"/>
  <!-- Code symbols -->
  <text x="300" y="200" font-family="Courier New, monospace" font-size="48" font-weight="bold" fill="url(#grad3)" text-anchor="middle">{ }</text>
  <text x="300" y="260" font-family="Arial,sans-serif" font-size="20" fill="#00ccff" text-anchor="middle">Custom Software</text>
  <text x="300" y="295" font-family="Arial,sans-serif" font-size="14" fill="#8b8fa3" text-anchor="middle">Web & Mobile Applications</text>
  <!-- Code lines -->
  <rect x="150" y="330" width="300" height="3" rx="1.5" fill="#0066ff" opacity="0.5"/>
  <rect x="150" y="350" width="250" height="3" rx="1.5" fill="#00ccff" opacity="0.5"/>
  <rect x="150" y="370" width="280" height="3" rx="1.5" fill="#00ffcc" opacity="0.5"/>
  <!-- Decorative elements -->
  <circle cx="80" cy="80" r="25" fill="#0066ff" opacity="0.2"/>
  <circle cx="520" cy="420" r="35" fill="#00ffcc" opacity="0.2"/>
</svg>
