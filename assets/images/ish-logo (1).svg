<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066ff"/>
      <stop offset="100%" style="stop-color:#00aaff"/>
    </linearGradient>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ccff"/>
      <stop offset="100%" style="stop-color:#00ffcc"/>
    </linearGradient>
  </defs>

  <!-- Infinity Symbol Icon -->
  <g transform="translate(5, 15)">
    <!-- Main infinity loop -->
    <path d="M15,30 C15,15 25,15 30,30 C35,45 45,45 55,30 C65,15 75,15 75,30 C75,45 65,45 55,30 C45,15 35,15 30,30 C25,45 15,45 15,30"
          fill="none" stroke="url(#blueGradient)" stroke-width="4" stroke-linecap="round"/>
    <!-- Inner glow effect -->
    <circle cx="45" cy="30" r="5" fill="url(#cyanGradient)"/>
    <circle cx="45" cy="30" r="3" fill="#ffffff"/>
    <!-- Accent dots -->
    <circle cx="25" cy="20" r="2" fill="#0066ff"/>
    <circle cx="65" cy="20" r="2" fill="#00aaff"/>
  </g>

  <!-- Company Name -->
  <text x="95" y="35" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#0066ff">Infinity</text>
  <text x="95" y="60" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#333333">SoftHub</text>

  <!-- Tagline (optional) -->
  <text x="95" y="78" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666666" letter-spacing="2">TECHNOLOGIES</text>
</svg>
