<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80" width="350" height="80">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0055ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0088ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ccff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Infinity Symbol -->
  <g transform="translate(5, 10)">
    <path d="M20,30 C20,15 30,15 30,30 C30,45 40,45 50,30 C60,15 70,15 70,30 C70,45 60,45 50,30 C40,15 30,15 30,30 C30,45 20,45 20,30"
          fill="none" stroke="url(#grad1)" stroke-width="5" stroke-linecap="round"/>
    <!-- Central dot -->
    <circle cx="50" cy="30" r="4" fill="#00ccff"/>
    <!-- Small tech elements -->
    <circle cx="35" cy="18" r="2.5" fill="#0055ff"/>
    <circle cx="65" cy="18" r="2.5" fill="#0055ff"/>
  </g>

  <!-- Text Part -->
  <text x="90" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#0055ff">Infinity</text>
  <text x="90" y="60" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="500" fill="#333333">SoftHub</text>
</svg>
