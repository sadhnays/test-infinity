<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <rect width="600" height="500" fill="#0a0e27"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ccff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- LMS Illustration -->
  <rect x="100" y="100" width="400" height="300" rx="20" fill="#1a1f3a" stroke="#0066ff" stroke-width="2"/>
  <!-- Graduation cap icon -->
  <circle cx="300" cy="200" r="60" fill="url(#grad1)"/>
  <text x="300" y="215" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">M</text>
  <!-- Text -->
  <text x="300" y="320" font-family="Arial,sans-serif" font-size="24" fill="#00ccff" text-anchor="middle">Moodle LMS</text>
  <text x="300" y="355" font-family="Arial,sans-serif" font-size="16" fill="#8b8fa3" text-anchor="middle">Development & Customization</text>
  <!-- Decorative elements -->
  <circle cx="80" cy="80" r="30" fill="#0066ff" opacity="0.2"/>
  <circle cx="520" cy="420" r="40" fill="#00ccff" opacity="0.2"/>
  <circle cx="150" cy="400" r="25" fill="#00ffcc" opacity="0.2"/>
</svg>
